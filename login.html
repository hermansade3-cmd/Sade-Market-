<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingia — SOKO KUU</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
/* =========================================================
   SOKO KUU — LOGIN / SIGNUP
   Muundo wa kisasa wenye rangi za Bendera ya Tanzania
   ========================================================= */

:root{
  --tz-green:#1EB53A;
  --tz-green-dark:#0f7a24;
  --tz-yellow:#FCD116;
  --tz-black:#0a0a0a;
  --tz-blue:#00A3DD;
  --card-bg:#ffffff;
  --text-dark:#17202a;
  --text-muted:#68717d;
  --border:#e4e7eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Nunito',sans-serif;
  background:#0d1a12;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1.2rem;
  color:var(--text-dark);
}

.auth-shell{
  width:100%;
  max-width:420px;
  position:relative;
}

/* =========================================================
   TANZANIA FLAG BANNER
   ========================================================= */

.flag-banner{
  position:relative;
  height:150px;
  border-radius:24px 24px 0 0;
  overflow:hidden;
  background:var(--tz-green);
}

.flag-banner svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.flag-overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.45) 100%);
  text-align:center;
  padding:0 1rem;
}

.logo-mark{
  width:58px;
  height:58px;
  border-radius:16px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.6rem;
  font-weight:900;
  color:var(--tz-green-dark);
  box-shadow:0 8px 20px rgba(0,0,0,.25);
  margin-bottom:.5rem;
}

.flag-overlay h1{
  color:#fff;
  font-size:1.35rem;
  font-weight:800;
  margin:0;
  text-shadow:0 2px 8px rgba(0,0,0,.35);
}

.flag-overlay p{
  color:rgba(255,255,255,.92);
  font-size:.78rem;
  margin:.25rem 0 0;
  text-shadow:0 1px 4px rgba(0,0,0,.35);
}

/* =========================================================
   CARD
   ========================================================= */

.auth-card{
  background:var(--card-bg);
  border-radius:0 0 24px 24px;
  padding:1.5rem 1.4rem 1.7rem;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.tabs{
  display:flex;
  background:#f1f3f5;
  border-radius:14px;
  padding:.3rem;
  margin-bottom:1.2rem;
}

.tab{
  flex:1;
  border:0;
  background:transparent;
  padding:.65rem 0;
  border-radius:10px;
  font-weight:800;
  font-size:.85rem;
  font-family:inherit;
  color:var(--text-muted);
  cursor:pointer;
  transition:all .2s;
}

.tab.active{
  background:var(--tz-green);
  color:#fff;
  box-shadow:0 4px 12px rgba(30,181,58,.35);
}

.auth-error{
  display:none;
  background:#fdecea;
  color:#c0392b;
  border:1px solid #f5b7b1;
  border-radius:10px;
  padding:.65rem .8rem;
  font-size:.78rem;
  font-weight:700;
  margin-bottom:1rem;
}

.auth-error.show{
  display:block;
}

.field{
  margin-bottom:1rem;
  display:flex;
  flex-direction:column;
  gap:.35rem;
}

.field label{
  font-size:.78rem;
  font-weight:800;
  color:var(--text-dark);
}

.field input{
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:.75rem .9rem;
  font-size:.92rem;
  font-family:inherit;
  outline:none;
  transition:border-color .2s;
  width:100%;
}

.field input:focus{
  border-color:var(--tz-green);
}

.pw-wrap{
  position:relative;
}

.pw-wrap input{
  padding-right:2.6rem;
}

.pw-toggle{
  position:absolute;
  right:.7rem;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:0;
  cursor:pointer;
  font-size:1rem;
  color:var(--text-muted);
  padding:.2rem;
}

.btn-full{
  width:100%;
  border:0;
  border-radius:12px;
  padding:.85rem 0;
  font-size:.95rem;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
  color:#fff;
  transition:filter .2s, transform .1s;
}

.btn-full:active{
  transform:scale(.98);
}

.btn-full:disabled{
  opacity:.65;
  cursor:default;
}

.btn-tz{
  background:linear-gradient(135deg, var(--tz-green) 0%, var(--tz-green-dark) 100%);
  box-shadow:0 8px 20px rgba(30,181,58,.35);
}

.btn-tz:hover:not(:disabled){
  filter:brightness(1.05);
}

.hint{
  font-size:.72rem;
  color:var(--text-muted);
  line-height:1.5;
}

.hint a{
  color:var(--tz-green-dark);
  font-weight:700;
  text-decoration:none;
}

.back-link{
  display:block;
  text-align:center;
  margin-top:1.1rem;
  color:rgba(255,255,255,.85);
  font-size:.82rem;
  font-weight:700;
  text-decoration:none;
}

.back-link:hover{
  color:#fff;
}
</style>
</head>

<body>

<div class="auth-shell">

  <!-- TANZANIA FLAG BANNER -->
  <div class="flag-banner">

    <svg viewBox="0 0 300 150" preserveAspectRatio="none">
      <!-- Green upper-left triangle -->
      <polygon points="0,0 300,0 0,150" fill="#1EB53A"/>
      <!-- Blue lower-right triangle -->
      <polygon points="300,0 300,150 0,150" fill="#00A3DD"/>
      <!-- Black diagonal band -->
      <polygon points="0,120 0,150 30,150 300,30 300,0 270,0" fill="#0a0a0a"/>
      <!-- Yellow borders on the black band -->
      <polygon points="0,112 0,120 270,0 262,0" fill="#FCD116"/>
      <polygon points="30,150 38,150 300,38 300,30" fill="#FCD116"/>
    </svg>

    <div class="flag-overlay">
      <div class="logo-mark">S</div>
      <h1>Karibu SOKO KUU</h1>
      <p>Ingia au jisajili ili uanze kuposti bidhaa zako</p>
    </div>

  </div>

  <!-- AUTH CARD -->
  <div class="auth-card">

    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">Ingia</button>
      <button class="tab" id="tabSignup" type="button">Jisajili</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <form id="authForm">

      <div class="field" id="nameField" style="display:none;">
        <label for="fullName">Jina Lako</label>
        <input type="text" id="fullName" placeholder="Mfano: Herman Sade" autocomplete="name">
      </div>

      <div class="field">
        <label for="email">Barua Pepe</label>
        <input type="email" id="email" placeholder="wewe@mfano.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Nenosiri</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="•••••••" minlength="6" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Onyesha nenosiri">👁️</button>
        </div>
      </div>

      <button class="btn-full btn-tz" id="submitBtn" type="submit">Ingia</button>

    </form>

    <p class="hint" style="text-align:center;margin-top:1.1rem;">
      Kwa kuendelea, unakubaliana na
      <a href="terms.html">Masharti ya Matumizi</a>.
      Namba yako ya simu itaonekana kwa wanunuzi wanapotaka kuwasiliana nawe.
    </p>

  </div>

  <a class="back-link" href="index.html">‹ Rudi Dukani bila kuingia</a>

</div>

<script type="module">
  import {
    auth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    updateProfile
  } from "./firebase-init.js";

  const errorBox = document.getElementById('authError');
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const nameField = document.getElementById('nameField');
  const submitBtn = document.getElementById('submitBtn');
  const pwToggle = document.getElementById('pwToggle');
  const passwordInput = document.getElementById('password');
  let mode = 'login';

  function setMode(m){
    mode = m;
    hideError();
    if(m === 'login'){
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
      nameField.style.display = 'none';
      submitBtn.textContent = 'Ingia';
    } else {
      tabSignup.classList.add('active');
      tabLogin.classList.remove('active');
      nameField.style.display = 'flex';
      submitBtn.textContent = 'Jisajili';
    }
  }
  tabLogin.addEventListener('click', () => setMode('login'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  pwToggle.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    pwToggle.textContent = isHidden ? '🙈' : '👁️';
  });

  function showError(msg){ errorBox.textContent = msg; errorBox.classList.add('show'); }
  function hideError(){ errorBox.classList.remove('show'); }

  function translateError(code){
    const map = {
      'auth/invalid-email': 'Barua pepe si sahihi.',
      'auth/user-not-found': 'Akaunti haipo. Jisajili kwanza.',
      'auth/wrong-password': 'Nenosiri si sahihi.',
      'auth/invalid-credential': 'Barua pepe au nenosiri si sahihi.',
      'auth/email-already-in-use': 'Barua pepe hii tayari inatumika. Jaribu kuingia.',
      'auth/weak-password': 'Nenosiri ni fupi mno (angalau herufi 6).',
      'auth/too-many-requests': 'Majaribio mengi. Subiri kidogo kisha jaribu tena.'
    };
    return map[code] || 'Hitilafu imetokea. Jaribu tena.';
  }

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const name = document.getElementById('fullName').value.trim();

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'login' ? 'Inaingia...' : 'Inajisajili...';

    try{
      if(mode === 'login'){
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        if(name){ await updateProfile(cred.user, { displayName: name }); }
      }
      window.location.href = 'index.html';
    } catch(err){
      showError(translateError(err.code));
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'login' ? 'Ingia' : 'Jisajili';
    }
  });

  // Ikiwa tayari umeingia, ruka moja kwa moja dukani
  onAuthStateChanged(auth, (user) => {
    if(user){ window.location.href = 'index.html'; }
  });
</script>

</body>
</html>
