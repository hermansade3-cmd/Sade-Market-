<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingia — Duka Langu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-hero">
    <div class="logo-mark">D</div>
    <h1>Karibu Duka Langu</h1>
    <p>Ingia au jisajili ili uanze kuposti bidhaa zako</p>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">Ingia</button>
      <button class="tab" id="tabSignup" type="button">Jisajili</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none;">
        <label for="fullName">Jina Lako</label>
        <input type="text" id="fullName" placeholder="Mfano: Herman Sade">
      </div>
      <div class="field">
        <label for="email">Barua Pepe</label>
        <input type="email" id="email" placeholder="wewe@mfano.com" required>
      </div>
      <div class="field">
        <label for="password">Nenosiri</label>
        <input type="password" id="password" placeholder="•••••••" minlength="6" required>
      </div>
      <button class="btn-full btn-blue" id="submitBtn" type="submit">Ingia</button>
    </form>

    <div class="divider">au</div>

    <button class="google-btn" id="googleBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.5 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.2 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.7 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.2 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 35 26.8 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.3 5.3C40.9 36.4 44 30.9 44 24c0-1.3-.1-2.6-.4-3.5z"/></svg>
      Endelea na Google
    </button>

    <p class="hint" style="text-align:center;margin-top:1rem;">
      Kwa kuendelea, unakubaliana na <a href="terms.html" style="color:var(--blue-dark);font-weight:700;">Masharti ya Matumizi</a>. Namba yako ya WhatsApp itaonekana kwa wanunuzi wanapotaka kuwasiliana nawe.
    </p>
  </div>

  <a class="back-link" href="index.html">‹ Rudi Dukani bila kuingia</a>
</div>

<script type="module">
  import {
    auth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signInWithPopup, GoogleAuthProvider, updateProfile
  } from "./firebase-init.js";

  const errorBox = document.getElementById('authError');
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const nameField = document.getElementById('nameField');
  const submitBtn = document.getElementById('submitBtn');
  let mode = 'login';

  function setMode(m){
    mode = m;
    hideError();
    if(m === 'login'){
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
      nameField.style.display = 'none';
      submitBtn.textContent = 'Ingia';
    } else {
      tabSignup.classList.add('active');
      tabLogin.classList.remove('active');
      nameField.style.display = 'flex';
      submitBtn.textContent = 'Jisajili';
    }
  }
  tabLogin.addEventListener('click', () => setMode('login'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  function showError(msg){ errorBox.textContent = msg; errorBox.classList.add('show'); }
  function hideError(){ errorBox.classList.remove('show'); }

  function translateError(code){
    const map = {
      'auth/invalid-email': 'Barua pepe si sahihi.',
      'auth/user-not-found': 'Akaunti haipo. Jisajili kwanza.',
      'auth/wrong-password': 'Nenosiri si sahihi.',
      'auth/invalid-credential': 'Barua pepe au nenosiri si sahihi.',
      'auth/email-already-in-use': 'Barua pepe hii tayari inatumika. Jaribu kuingia.',
      'auth/weak-password': 'Nenosiri ni fupi mno (angalau herufi 6).',
      'auth/too-many-requests': 'Majaribio mengi. Subiri kidogo kisha jaribu tena.',
      'auth/popup-closed-by-user': 'Umefunga dirisha la Google kabla ya kumaliza.'
    };
    return map[code] || 'Hitilafu imetokea. Jaribu tena.';
  }

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const name = document.getElementById('fullName').value.trim();

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'login' ? 'Inaingia...' : 'Inajisajili...';

    try{
      if(mode === 'login'){
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        if(name){ await updateProfile(cred.user, { displayName: name }); }
      }
      window.location.href = 'index.html';
    } catch(err){
      showError(translateError(err.code));
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'login' ? 'Ingia' : 'Jisajili';
    }
  });

  document.getElementById('googleBtn').addEventListener('click', async () => {
    hideError();
    try{
      await signInWithPopup(auth, new GoogleAuthProvider());
      window.location.href = 'index.html';
    } catch(err){
      showError(translateError(err.code));
    }
  });

  // Ikiwa tayari umeingia, ruka moja kwa moja dukani
  onAuthStateChanged(auth, (user) => {
    if(user){ window.location.href = 'index.html'; }
  });
</script>

</body>
</html>
